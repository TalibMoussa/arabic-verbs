<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>مشجرة الأفعال</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600&display=swap">
<style>
/* Light theme only, to match the website.
   Layout: horizontal tree read right to left; every label node is the same size (152x56),
   every forms card is the same width, so columns line up. Fits itself to the screen on laptops;
   becomes an indented outline on tablets and phones.
   Palette: one emerald ramp by depth (root darkest), antique gold for forms and the active path. */
:root {
  --bg: #f2f7f6; --surface: #ffffff; --ink: #0f2523; --muted: #576f6c; --border: #d0e0dd;
  --n1: #005d59; --n2: #006f6a; --n3: #00807a;
  --grp-bg: #e1f2f0; --grp-bd: #7fc3bd; --leaf-bd: #b3d0cc;
  --accent: #b34312; --accent-ink: #92350d; --accent-soft: #fdf1ea; --accent-bd: #e3b9a3;
  --chip-bg: #ffffff; --line: #cfa48e;
  --ui: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
  --display: 'Reem Kufi', 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif;
  --form: 'Amiri', 'Noto Naskh Arabic', 'Traditional Arabic', 'Times New Roman', serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--ui);
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1400px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }

header { display: flex; flex-direction: column; gap: 4px; }
h1 { margin: 0; font: 600 clamp(26px, 4.5vw, 36px)/1.25 var(--display); text-wrap: balance; color: var(--n1); }
.lead { margin: 0; color: var(--muted); max-width: 64ch; font-size: 14px; }

.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar .grow { flex: 1 1 220px; min-width: 0; }
input[type="search"] {
  width: 100%; font: 400 15px var(--ui); color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 14px; height: 40px;
  direction: rtl; text-align: right;
}
input[type="search"]::placeholder { color: var(--muted); }
button.ctl {
  font: 500 14px var(--ui); color: var(--ink); background: var(--surface); height: 40px;
  border: 1.5px solid var(--border); border-radius: 10px; padding: 0 14px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
button.ctl:hover { border-color: var(--accent); }
button.ctl[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-bd); color: var(--accent-ink); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#count { font-size: 13px; color: var(--muted); min-height: 1.2em; margin-top: -6px; }

.crumb {
  display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline;
  font-size: 14px; padding: 9px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; min-height: 42px;
}
.crumb .k { color: var(--muted); font-weight: 500; }
.crumb .arrow { color: var(--accent); }
.crumb .last { font-weight: 600; }
.crumb .form { font: 700 26px/1.9 var(--form); color: var(--accent-ink); }
.crumb .meta { color: var(--muted); font-size: 12.5px; margin-inline-start: auto; }
.crumb .empty { color: var(--muted); }

.stage {
  overflow-x: auto; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 22px;
}
.fit { position: relative; }

/* tree */
.tree, .kids { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; }
.kids { position: relative; margin-inline-start: 22px; display: flex; flex-direction: column; }
.kids::before { content: ""; position: absolute; inset-inline-start: -22px; width: 22px; top: 50%; margin-top: -1px; border-top: 2px solid var(--line); transition: border-color .2s; }
.kid { position: relative; padding-block: 5px; padding-inline-start: 22px; }
.kid::before { content: ""; position: absolute; inset-inline-start: 0; width: 22px; top: 50%; margin-top: -1px; border-top: 2px solid var(--line); transition: border-color .2s; }
.kid::after { content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; border-inline-start: 2px solid var(--line); }
.kid:first-child::after { top: calc(50% - 1px); }
.kid:last-of-type::after { bottom: calc(50% - 1px); }
.kid:only-of-type::after { display: none; }
.hl { position: absolute; inset-inline-start: 0; width: 2px; background: var(--accent); pointer-events: none; z-index: 1; }
.kid.top { padding: 0; }
.kid.top::before, .kid.top::after { display: none; }
.kid.closed > .row > .kids { display: none; }
.kid.on-path::before { border-top-color: var(--accent); }
.kid.on-path:not(.is-sel) > .row > .kids::before { border-top-color: var(--accent); }

.kid:not(.closed) > .row > .kids { animation: grow .24s ease-out; }
@keyframes grow { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }

/* nodes: one size for every label node */
.node {
  position: relative; flex: none; width: 152px; height: 56px; padding: 0 8px;
  display: flex; align-items: center; gap: 6px;
  font: 600 14px/1.3 var(--ui); color: var(--ink); text-align: center; cursor: pointer;
  background: var(--surface); border: 2px solid var(--leaf-bd); border-radius: 12px;
  transition: transform .15s, box-shadow .15s, border-color .15s, opacity .15s;
}
.node:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(0, 0, 0, .14); }
.node .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.node .tog {
  flex: none; width: 20px; height: 20px; border-radius: 50%; font-size: 15px; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, currentColor 16%, transparent);
}
.kid:not(.closed) > .row > .node .tog::before { content: "\2212"; }
.kid.closed > .row > .node .tog::before { content: "+"; }

.node.k-root { background: var(--n1); border-color: var(--n1); color: #fff; font-family: var(--display); font-weight: 600; font-size: 16px; }
.node.k-sub  { background: var(--n2); border-color: var(--n2); color: #fff; font-family: var(--display); font-weight: 600; font-size: 15px; }
.node.k-cat  { background: var(--n3); border-color: var(--n3); color: #fff; }
.node.k-grp  { background: var(--grp-bg); border-color: var(--grp-bd); }
.node.k-leaf { background: var(--surface); border-color: var(--leaf-bd); font-weight: 500; }

.node.in-path { border-color: var(--accent); }
.node.sel { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent); }
.node.hit { outline: 3px solid var(--accent); outline-offset: 2px; }
.node.dim { opacity: .3; }

/* forms card: same width everywhere, chips in an even grid */
.node.has-forms {
  width: 300px; height: auto; min-height: 56px; flex-direction: column; align-items: stretch; gap: 6px;
  padding: 8px; text-align: start; cursor: pointer;
  background: var(--accent-soft); border-color: var(--accent-bd);
}
.node.has-forms .lbl { font-size: 13px; font-weight: 600; color: var(--accent-ink); }
.chips { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 5px; }
.chip {
  font: 400 22px/2 var(--form); color: var(--ink); text-align: center; white-space: nowrap;
  background: var(--chip-bg); border: 1px solid var(--accent-bd); border-radius: 8px; padding: 0 6px;
  animation: pop .26s ease-out both; animation-delay: calc(var(--i, 0) * 28ms);
  transition: background .15s, border-color .15s, color .15s;
}
.chip:hover { border-color: var(--accent); }
.chip.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.hit { background: color-mix(in srgb, var(--accent) 32%, var(--chip-bg)); border-color: var(--accent); }
.chips .sep { grid-column: 1 / -1; height: 2px; background: var(--accent-bd); border-radius: 1px; margin-block: 2px; }


@media (min-width: 901px) {
  .tree { position: absolute; top: 0; right: 0; width: max-content; transform-origin: top right; }
}
@media (max-width: 900px) {
  .stage { padding: 14px 10px; }
  .row { flex-direction: column; align-items: stretch; }
  .kids { margin-inline-start: 14px; }
  .kids::before { display: none; }
  .kid { padding-inline-start: 16px; }
  .kid::before { width: 16px; top: 33px; margin-top: -1px; }
  .kid::after { top: 0; bottom: 0; }
  .kid:first-child::after { top: 0; }
  .kid:last-of-type::after { bottom: auto; height: 33px; }
  .kid:only-of-type::after { display: block; bottom: auto; height: 33px; }
  .kid.on-path:not(.is-sel) > .row > .kids::before { border-top-color: var(--line); }
  .node { width: 100%; font-size: 15px; }
  .chips { grid-template-columns: repeat(min(var(--cols, 3), 2), minmax(0, 1fr)); }
  .chips.wide { grid-template-columns: 1fr; }
  .node.has-forms { width: 100%; }
  .kid.top > .row > .node { width: 100%; }
  @keyframes grow { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<div class="page" dir="rtl" lang="ar">
  <header>
    <h1>مشجرة الأفعال</h1>
    <p class="lead">اضغط على أي عقدة لفتح فروعها. في وضع التركيز يُفتح فرع واحد في كل مستوى ليبقى الشكل مرتبًا. اضغط على أي صيغة لعرضها مع مسارها.</p>
  </header>

  <div class="bar" role="toolbar" aria-label="أدوات المشجرة">
    <div class="grow">
      <input id="q" type="search" dir="rtl" lang="ar" placeholder="ابحث عن صيغة أو مصطلح" aria-label="بحث في المشجرة" autocomplete="off">
    </div>
    <button class="ctl" id="btn-focus" type="button" aria-pressed="true">وضع التركيز</button>
    <button class="ctl" id="btn-main" type="button">الفروع الستة</button>
    <button class="ctl" id="btn-all" type="button">فتح الكل</button>
    <button class="ctl" id="btn-none" type="button">طي الكل</button>
  </div>
  <div id="count" aria-live="polite"></div>

  <div class="crumb" id="crumb" aria-live="polite"><span class="empty">اختر أي عقدة أو صيغة لعرض مسارها من الجذر.</span></div>

  <div class="stage" id="stage" dir="rtl"><div class="fit" id="fit"><ul class="tree" id="tree"></ul></div></div>
</div>

<script>
(function () {
  var SEP = '|';
  function L(t, forms, cols) { return { t: t, forms: forms, cols: cols }; }
  function G(t, kids) { return { t: t, kids: kids }; }

  var CAT4 = {
    t: 'من حيث التجرد والزيادة', k: 'cat', kids: [
      G('مجرد', [
        G('ثلاثي', [
          L('له ستة أبواب', [
            'فَعَلَ يَفْعُلُ', 'فَعَلَ يَفْعِلُ', 'فَعَلَ يَفْعَلُ',
            'فَعِلَ يَفْعَلُ', 'فَعُلَ يَفْعُلُ', 'فَعِلَ يَفْعِلُ'
          ], 2)
        ]),
        G('رباعي', [
          L('أصلي', ['فَعْلَلَ'], 1),
          L('ملحق به', ['فَوْعَلَ', 'فَيْعَلَ', 'فَعْنَلَ', 'فَعْوَلَ', 'فَعْيَلَ', 'فَعْلَلَ', 'فَعْمَلَ', 'فَعْنَلَ', 'فَعْلَلَ', 'فَعْلَى'])
        ])
      ]),
      G('مزيد', [
        G('ثلاثي', [
          L('بحرفٍ واحدٍ', ['أَفْعَلَ', 'فَاعَلَ', 'فَعَّلَ']),
          L('بحرفين', ['انْفَعَلَ', 'افْتَعَلَ', 'افْعَلَّ', 'تَفَعَّلَ', 'تَفَاعَلَ']),
          L('بثلاثة أحرف', ['اسْتَفْعَلَ', 'افْعَوْعَلَ', 'افْعَالَّ', 'افْعَوَّلَ'])
        ]),
        G('رباعي', [
          G('بحرفٍ واحدٍ', [
            L('أصلي', ['تَفَعْلَلَ'], 1),
            L('ملحق به', ['تَفَوْعَلَ', 'تَفَيْعَلَ', 'تَمَفْعَلَ', 'تَفَعْوَلَ', 'تَفَعْيَلَ', 'تَفَعْلَلَ', 'تَفَأْعَلَ', 'تَفَعْنَلَ', 'تَفَعْلَلَ', 'تَفَعْلَى'])
          ]),
          G('بحرفين', [
            L('أصلي', ['افْعَنْلَلَ', 'افْعَلَلَّ'], 2),
            L('ملحق به', ['افْعَنْلَى', 'افْعَنْلَلَ', 'افْعَنْمَلَ', 'افْعَنْلَأً', SEP, 'افْعَأَلَّ', 'افْوَعَلَّ', 'افْلَعَلَّ', 'افْمَعَلَّ'])
          ])
        ])
      ])
    ]
  };

  var DATA = {
    t: 'علم الصرف (الأفعال)', k: 'root',
    kids: [{
      t: 'تصنيف الأفعال', k: 'sub',
      kids: [
        { t: 'من حيث الجمود والتصرف', k: 'cat', kids: [
          L('جامد'),
          G('متصرف', [L('ناقص التصرف'), L('تام التصرف')])
        ]},
        { t: 'من حيث المضارعة والطلب', k: 'cat', kids: [
          L('ماضٍ'), L('مضارع'), L('طلب')
        ]},
        { t: 'من حيث الصحة والاعتلال', k: 'cat', kids: [
          G('صحيح', [
            G('مضعَّف', [L('ثلاثي'), L('رباعي')]),
            L('مهموز'),
            L('سالم')
          ]),
          G('معتل', [
            G('غير لفيف', [L('مثال'), L('أجوف'), L('ناقص')]),
            G('لفيف', [L('مقرون'), L('مفروق')])
          ])
        ]},
        CAT4,
        { t: 'من حيث التعدي واللزوم', k: 'cat', kids: [
          G('ما يوصف بالتعدي أو اللزوم', [
            L('لازم'),
            G('متعدٍّ', [
              L('إلى مفعولٍ به واحدٍ'),
              G('إلى مفعولين', [
                L('ليس أصلهما المبتدأ والخبر'),
                L('أصلهما المبتدأ والخبر')
              ]),
              L('إلى مفعولاتٍ ثلاثة')
            ])
          ]),
          L('ما لا يوصف بالتعدي ولا اللزوم')
        ]},
        { t: 'من حيث البناء للفاعل والبناء لغيره', k: 'cat', kids: [
          L('مبنيٌّ للفاعل'), L('مبنيٌّ لغير الفاعل')
        ]}
      ]
    }]
  };

  var all = [];
  var selected = null;
  var focusMode = true;

  function norm(s) {
    return (s || '')
      .replace(/[ً-ٰٟـ]/g, '')
      .replace(/[أإآٱ]/g, 'ا')
      .replace(/ى/g, 'ي')
      .replace(/ة/g, 'ه')
      .replace(/\s+/g, ' ')
      .trim();
  }
  function ar(n) { return n.toLocaleString('ar-EG'); }
  function mk(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function build(n, parent, depth) {
    n.parent = parent;
    all.push(n);
    var hasKids = !!(n.kids && n.kids.length);
    var kind = n.k || (hasKids ? 'grp' : 'leaf');
    n.kind = kind;

    var li = mk('li', 'kid' + (depth === 0 ? ' top' : ''));
    var row = mk('div', 'row');
    var btn = mk('button', 'node k-' + kind + (n.forms ? ' has-forms' : ''));
    btn.type = 'button';

    n.chips = [];
    if (n.forms) {
      btn.appendChild(mk('span', 'lbl', n.t));
      var chips = mk('span', 'chips');
      var cols = n.cols || (n.forms.length === 1 ? 1 : 3);
      chips.style.setProperty('--cols', cols);
      if (cols === 2) chips.classList.add('wide');
      var idx = 0;
      n.forms.forEach(function (f) {
        if (f === SEP) { chips.appendChild(mk('span', 'sep')); return; }
        var c = mk('span', 'chip', f);
        c.style.setProperty('--i', idx++);
        chips.appendChild(c);
        n.chips.push({ el: c, text: f });
      });
      btn.appendChild(chips);
    } else {
      btn.appendChild(mk('span', 'txt', n.t));
    }
    if (hasKids) {
      var tog = mk('span', 'tog');
      tog.setAttribute('aria-hidden', 'true');
      btn.appendChild(tog);
      btn.setAttribute('aria-expanded', 'true');
    }
    row.appendChild(btn);

    if (hasKids) {
      var ul = mk('ul', 'kids');
      n.kids.forEach(function (c) { ul.appendChild(build(c, n, depth + 1)); });
      row.appendChild(ul);
    }
    li.appendChild(row);
    n.li = li; n.btn = btn; n.hasKids = hasKids;

    btn.addEventListener('click', function (e) {
      var chipEl = e.target.closest ? e.target.closest('.chip') : null;
      select(n, chipEl ? chipEl.textContent : null, chipEl);
      if (hasKids) {
        var opening = li.classList.contains('closed');
        if (opening && focusMode && parent) {
          parent.kids.forEach(function (s) { if (s !== n) setOpen(s, false); });
        }
        setOpen(n, opening);
      }
      updateHL();
    });
    return li;
  }

  function setOpen(n, open) {
    if (!n.hasKids) return;
    n.li.classList.toggle('closed', !open);
    n.btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function select(n, chipText, chipEl) {
    if (selected) {
      selected.btn.classList.remove('sel');
      selected.li.classList.remove('is-sel');
      for (var q = selected; q; q = q.parent) { q.li.classList.remove('on-path'); q.btn.classList.remove('in-path'); }
      selected.chips.forEach(function (c) { c.el.classList.remove('sel'); });
    }
    selected = n;
    n.btn.classList.add('sel');
    n.li.classList.add('is-sel');
    if (chipEl) chipEl.classList.add('sel');
    var path = [];
    for (var p = n; p; p = p.parent) {
      p.li.classList.add('on-path');
      if (p !== n) p.btn.classList.add('in-path');
      path.unshift(p);
    }
    var crumb = document.getElementById('crumb');
    crumb.textContent = '';
    crumb.appendChild(mk('span', 'k', 'المسار:'));
    path.forEach(function (p, i) {
      if (i > 0) crumb.appendChild(mk('span', 'arrow', '←'));
      crumb.appendChild(mk('span', i === path.length - 1 && !chipText ? 'last' : '', p.t));
    });
    if (chipText) {
      crumb.appendChild(mk('span', 'arrow', '←'));
      crumb.appendChild(mk('span', 'form', chipText));
    }
    var meta = n.hasKids ? 'فروعه: ' + ar(n.kids.length) : (n.chips.length ? ar(n.chips.length) + ' صيغ' : '');
    if (meta && !chipText) crumb.appendChild(mk('span', 'meta', meta));
    updateHL();
  }

  var tree = document.getElementById('tree');
  tree.appendChild(build(DATA, null, 0));
  var mq = window.matchMedia('(max-width: 900px)');

  /* gold overlay on the vertical spine, from the parent's junction to each on-path child */
  function updateHL() {
    var old = tree.querySelectorAll('.hl');
    for (var i = 0; i < old.length; i++) old[i].remove();
    if (!selected) return;
    for (var p = selected; p && p.parent; p = p.parent) {
      var li = p.li, kids = li.parentElement;
      if (!kids || !kids.offsetHeight) continue;
      var y1, y2;
      if (mq.matches) { y1 = 0; y2 = li.offsetTop + 33; }
      else {
        var c = li.offsetTop + li.offsetHeight / 2, j = kids.offsetHeight / 2;
        y1 = Math.min(c, j) - 1; y2 = Math.max(c, j) + 1;
      }
      if (y2 - y1 < 3) continue;
      var h = document.createElement('span');
      h.className = 'hl'; h.style.top = y1 + 'px'; h.style.height = (y2 - y1) + 'px';
      kids.appendChild(h);
    }
  }

  function inCat4(n) { for (var p = n; p; p = p.parent) if (p === CAT4) return true; return false; }
  function resetOpen(fn) { all.forEach(function (n) { setOpen(n, fn(n)); }); updateHL(); }
  resetOpen(function (n) { return n.kind === 'root' || n.kind === 'sub' || inCat4(n); });

  document.getElementById('btn-all').addEventListener('click', function () { resetOpen(function () { return true; }); });
  document.getElementById('btn-none').addEventListener('click', function () { resetOpen(function () { return false; }); });
  document.getElementById('btn-main').addEventListener('click', function () {
    resetOpen(function (n) { return n.kind === 'root' || n.kind === 'sub'; });
  });
  var fbtn = document.getElementById('btn-focus');
  fbtn.addEventListener('click', function () {
    focusMode = !focusMode;
    fbtn.setAttribute('aria-pressed', focusMode ? 'true' : 'false');
  });

  var input = document.getElementById('q');
  var count = document.getElementById('count');
  input.addEventListener('input', function () {
    var q = norm(input.value);
    all.forEach(function (n) {
      n.btn.classList.remove('hit', 'dim');
      n.chips.forEach(function (c) { c.el.classList.remove('hit'); });
    });
    if (!q) { count.textContent = ''; return; }
    var hits = [];
    var onPath = new Set();
    all.forEach(function (n) {
      var hit = norm(n.t).indexOf(q) !== -1;
      n.chips.forEach(function (c) {
        if (norm(c.text).indexOf(q) !== -1) { c.el.classList.add('hit'); hit = true; }
      });
      if (hit) {
        hits.push(n);
        for (var p = n; p; p = p.parent) onPath.add(p);
      }
    });
    all.forEach(function (n) {
      if (hits.indexOf(n) !== -1) n.btn.classList.add('hit');
      else if (!onPath.has(n)) n.btn.classList.add('dim');
    });
    hits.forEach(function (n) {
      for (var p = n.parent; p; p = p.parent) setOpen(p, true);
    });
    count.textContent = hits.length ? ar(hits.length) + (hits.length <= 10 && hits.length > 1 ? ' نتائج' : ' نتيجة') : 'لا توجد نتائج';
    updateHL();
    if (hits.length) hits[0].btn.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  });

  /* fit the horizontal tree to the available width; outline layout on narrow screens */
  var stage = document.getElementById('stage');
  var fitEl = document.getElementById('fit');
  function fit() {
    if (mq.matches) {
      fitEl.style.width = ''; fitEl.style.height = ''; tree.style.transform = '';
      return;
    }
    var cs = getComputedStyle(stage);
    var avail = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var w = tree.offsetWidth, h = tree.offsetHeight;
    if (!w || !h) return;
    var s = Math.max(0.75, Math.min(1, avail / w));
    fitEl.style.width = (w * s) + 'px';
    fitEl.style.height = (h * s) + 'px';
    tree.style.transform = 'scale(' + s + ')';
  }
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function () { fit(); updateHL(); });
    ro.observe(tree); ro.observe(stage);
  }
  window.addEventListener('resize', fit);
  if (mq.addEventListener) mq.addEventListener('change', function () { fit(); updateHL(); });
  fit();
})();
</script>

</body></html>
